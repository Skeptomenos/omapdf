[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omapdf"
version = "0.1.0"
description = "Agent-native PDF annotation and signing for Linux"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Peter Bergin" }]
keywords = ["pdf", "annotation", "signature", "agent", "mcp", "omarchy"]
dependencies = [
  "pymupdf>=1.24",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest", "mcp>=1.2"]

[project.scripts]
omapdf = "omapdf.cli:main"
omapdf-mcp = "omapdf.mcp_server:main"

[project.urls]
Homepage = "https://github.com/pbergin11/omapdf"

[tool.hatch.build.targets.wheel]
packages = ["src/omapdf"]
